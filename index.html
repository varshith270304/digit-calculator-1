<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div class="calculator-box">
        <div class="brand"><span>Digit</span> Calculator</div>
        <div class="display">
            <input type="text" placeholder="0" readonly id="display"/>
        </div>
        <div class="option-container">
            <div class="btn" onclick="cleardisplay()">AC</div>
            <div class="btn" onclick="backspace()">DEL</div>
            <div class="btn" onclick="appendVal('/')">/</div>
            <div class="btn" onclick="appendVal('%')">%</div>

            <div class="btn" onclick="appendVal('7')">7</div>
            <div class="btn" onclick="appendVal('8')">8</div>
            <div class="btn" onclick="appendVal('9')">9</div>
            <div class="btn" onclick="appendVal('-')">-</div>

            <div class="btn" onclick="appendVal('4')">4</div>
            <div class="btn" onclick="appendVal('5')">5</div>
            <div class="btn" onclick="appendVal('6')">6</div>
            <div class="btn" onclick="appendVal('+')">+</div>

            <div class="btn" onclick="appendVal('1')">1</div>
            <div class="btn" onclick="appendVal('2')">2</div>
            <div class="btn" onclick="appendVal('3')">3</div>
            <div class="btn" onclick="appendVal('*')">x</div>

            <div class="btn" onclick="appendVal('0')">0</div>
            <div class="btn" onclick="appendVal('.')">.</div>
            <!-- <div class="btn" onclick="appendVal('.')">.</div> -->
            <div class="btn equals" onclick="calculate()">=</div>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
